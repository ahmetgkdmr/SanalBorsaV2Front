name: Deploy Frontend to Hetzner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build
      run: |
        npm install
        npm run build

    - name: Deploy Build Files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "dist/*"   # Eğer Vite kullanıyorsan "dist/*", Next/CRA kullanıyorsan "build/*" veya "out/*" yapabilirsin
        target: "/var/www/frontend"
        strip_components: 1
